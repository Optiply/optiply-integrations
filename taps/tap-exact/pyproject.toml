[tool.poetry]
name = "tap-exact"
version = "0.0.1"
description = "`tap-exact` is a Singer tap for Exact, built with the Meltano SDK for Singer Taps."
authors = ["hotglue"]
keywords = [
    "ELT",
    "Exact",
]
license = "Apache 2.0"

[tool.poetry.dependencies]
python = "<3.11,>=3.10"
requests = "^2.33.0"
singer-sdk = "^0.54.5"
xmltodict = "^1.0.4"
lxml = "^6.1.0"
memoization = "^0.4.0"
pendulum = "^3.2.0"

[tool.poetry.dev-dependencies]
pytest = "^9.0.3"
tox = "^4.60.0"
flake8 = "^7.3.0"
black = "^26.5.1"
pydocstyle = "^6.1.1"
mypy = "^2.3"
types-requests = "^2.26.1"
isort = "^8.0.1"

[tool.isort]
profile = "black"
multi_line_output = 3 # Vertical Hanging Indent
src_paths = "tap_exact"

[build-system]
requires = ["poetry-core==1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
# CLI declaration
tap-exact = 'tap_exact.tap:TapExact.cli'
