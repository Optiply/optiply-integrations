[tool.poetry]
name = "target-vendit"
version = "0.0.1"
description = "`target-vendit` is a Singer target for Vendit, built with the Meltano SDK for Singer Targets."
authors = ["Optiply"]
keywords = [
    "ELT",
    "Vendit",
]
license = "Apache 2.0"

[tool.poetry.dependencies]
python = "<3.11,>=3.10"
requests = "^2.33.0"
hotglue-singer-sdk = "^1.0.44"

[tool.poetry.dev-dependencies]
pytest = "^9.0.3"
tox = "^3.24.4"
flake8 = "^3.9.2"
black = "^24.3.0"
pydocstyle = "^6.1.1"
mypy = "^0.910"
types-requests = "^2.26.1"
isort = "^5.10.1"

[tool.isort]
profile = "black"
multi_line_output = 3 # Vertical Hanging Indent
src_paths = "target_vendit"

[build-system]
requires = ["poetry-core==1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
# CLI declaration
target-vendit = 'target_vendit.target:TargetVendit.cli'

