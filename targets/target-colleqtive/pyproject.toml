[tool.poetry]
name = "target-colleqtive"
version = "0.0.1"
description = "Singer target for exporting Optiply buyOrders to Colleqtive deliveries."
authors = ["Optiply"]
keywords = ["ELT", "Colleqtive"]
license = "Apache 2.0"

[tool.poetry.dependencies]
python = "<3.11,>=3.10"
requests = "^2.33.0"
hotglue-singer-sdk = "^1.0.44"

[tool.poetry.dev-dependencies]
pytest = "^9.0.3"
tox = "^4.60.0"
flake8 = "^7.3.0"
black = "^26.5.1"
pydocstyle = "^6.1.1"
mypy = "^2.3"
types-requests = "^2.26.1"
isort = "^8.0.1"

[tool.isort]
profile = "black"
multi_line_output = 3
src_paths = "target_colleqtive"

[build-system]
requires = ["poetry-core==1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
target-colleqtive = 'target_colleqtive.target:TargetColleqtive.cli'
